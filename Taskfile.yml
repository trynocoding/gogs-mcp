version: '3'

env:
  GOTOOLCHAIN: go1.25.0

vars:
  PACKAGE_VERSION:
    sh: git describe --tags --always --dirty | tr -d '\n'
  PACKAGE_COMMIT:
    sh: git rev-parse --short HEAD | tr -d '\n'
  PACKAGE_BUILD_TIME:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ | tr -d '\n'
  PACKAGE_DIR: dist/gogs-mcp-{{.PACKAGE_VERSION}}-fedora43-amd64-offline
  PACKAGE_STAGING: dist/.source-staging
  # Must mirror the GogsE2E constants in internal/packagegen: the Taskfile
  # builds the pinned Gogs test image that mkpackage then records.
  GOGS_E2E_VERSION: '0.14.2'
  GOGS_E2E_COMMIT: '5dcb6c64bdf61e38dbdbb941c1d69789c560d0fb'

tasks:
  default:
    deps: [build]

  build:
    desc: Build the gogs-mcp binary.
    cmds:
      - go build -trimpath -o .bin/gogs-mcp ./cmd/gogs-mcp

  vendor:
    desc: Refresh the vendored dependencies used by the offline package.
    cmds:
      - go mod vendor

  package:
    desc: Assemble the offline Fedora 43 AMD64 bundle under dist/.
    deps: [vendor]
    cmds:
      - rm -rf {{.PACKAGE_DIR}} {{.PACKAGE_DIR}}.tar.gz {{.PACKAGE_STAGING}}
      - mkdir -p {{.PACKAGE_DIR}}/bin {{.PACKAGE_DIR}}/source {{.PACKAGE_DIR}}/config {{.PACKAGE_DIR}}/docs {{.PACKAGE_DIR}}/scripts
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w -X gogs-mcp/internal/version.Version={{.PACKAGE_VERSION}} -X gogs-mcp/internal/version.Commit={{.PACKAGE_COMMIT}} -X gogs-mcp/internal/version.BuildTime={{.PACKAGE_BUILD_TIME}}' -o {{.PACKAGE_DIR}}/bin/gogs-mcp ./cmd/gogs-mcp
      - |
        # The source archive mirrors the working tree (tracked files, untracked
        # source, and the fresh vendor tree) so it always matches the binary.
        mkdir -p {{.PACKAGE_STAGING}}
        git ls-files -c -o --exclude-standard > {{.PACKAGE_STAGING}}/file-list
        echo vendor >> {{.PACKAGE_STAGING}}/file-list
        tar -czf {{.PACKAGE_DIR}}/source/gogs-mcp-{{.PACKAGE_VERSION}}.tar.gz -T {{.PACKAGE_STAGING}}/file-list
      - cp package/scripts/install.sh package/scripts/uninstall.sh package/scripts/verify-offline.sh package/scripts/load-image.sh {{.PACKAGE_DIR}}/scripts/
      - cp package/docs/*.md {{.PACKAGE_DIR}}/docs/
      - cp config.example.json package/config/mcp.example.json package/config/docker-mcp.example.json package/config/podman-mcp.example.json {{.PACKAGE_DIR}}/config/
      - |
        # Build the pinned Gogs v0.14.2 E2E image for offline test replays
        # when docker and the pinned Gogs checkout are available.
        source_dir="${GOGS_E2E_SOURCE_DIR:-../gogs}"
        # A docker binary without a reachable daemon must degrade to the skip
        # branch too: packaging worked without docker before the test assets.
        if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1 && [ "$(git -C "$source_dir" rev-parse HEAD 2>/dev/null)" = "{{.GOGS_E2E_COMMIT}}" ]; then
          mkdir -p {{.PACKAGE_DIR}}/test-assets {{.PACKAGE_STAGING}}/gogs-src
          git -C "$source_dir" archive --format=tar {{.GOGS_E2E_COMMIT}} | tar -x -C {{.PACKAGE_STAGING}}/gogs-src
          cp tests/e2e/testdata/gogs.Dockerfile {{.PACKAGE_STAGING}}/gogs-src/Dockerfile.smoke
          for pair in bootstrap:e2ebootstrap repositories-bootstrap:e2erepositories issues-bootstrap:e2eissues; do
            mkdir -p {{.PACKAGE_STAGING}}/gogs-src/internal/${pair#*:}
            cp tests/e2e/testdata/${pair%%:*}/main.go {{.PACKAGE_STAGING}}/gogs-src/internal/${pair#*:}/main.go
          done
          docker build --platform linux/amd64 --build-arg GOGS_COMMIT={{.GOGS_E2E_COMMIT}} --tag gogs-e2e:{{.GOGS_E2E_VERSION}} -f {{.PACKAGE_STAGING}}/gogs-src/Dockerfile.smoke {{.PACKAGE_STAGING}}/gogs-src
          docker save --platform linux/amd64 -o {{.PACKAGE_DIR}}/test-assets/gogs-{{.GOGS_E2E_VERSION}}-amd64-image.tar gogs-e2e:{{.GOGS_E2E_VERSION}}
          rm -rf {{.PACKAGE_STAGING}}/gogs-src
        else
          echo "Skipping the Gogs E2E test image: docker or the pinned Gogs checkout is unavailable."
        fi
      - |
        # The metadata and the OCI image are assembled with every network
        # interface removed; the fallback keeps environments without user
        # namespaces usable.
        if unshare -n true 2>/dev/null; then
          unshare -n go run ./cmd/mkpackage -root {{.PACKAGE_DIR}} -project . -version {{.PACKAGE_VERSION}} -commit {{.PACKAGE_COMMIT}} -build-time {{.PACKAGE_BUILD_TIME}}
        else
          go run ./cmd/mkpackage -root {{.PACKAGE_DIR}} -project . -version {{.PACKAGE_VERSION}} -commit {{.PACKAGE_COMMIT}} -build-time {{.PACKAGE_BUILD_TIME}}
        fi
      - tar -czf {{.PACKAGE_DIR}}.tar.gz -C dist $(basename {{.PACKAGE_DIR}})
      - rm -rf {{.PACKAGE_STAGING}}
      - echo "Wrote {{.PACKAGE_DIR}}.tar.gz"

  verify:offline:
    desc: Rebuild-proof the offline bundle without any network access.
    deps: [package]
    cmds:
      - rm -rf .verify-offline && mkdir -p .verify-offline
      - tar -xzf {{.PACKAGE_DIR}}.tar.gz -C .verify-offline
      - sh -c 'cd .verify-offline/$(basename {{.PACKAGE_DIR}}) && sha256sum -c MANIFEST.sha256 --quiet'
      - .verify-offline/$(basename {{.PACKAGE_DIR}})/scripts/verify-offline.sh .verify-offline/$(basename {{.PACKAGE_DIR}})
      - |
        # When a container engine is present, import the OCI image and verify
        # its identity with pulls disabled; skip on engine-less machines.
        if command -v podman >/dev/null 2>&1 || command -v docker >/dev/null 2>&1; then
          .verify-offline/$(basename {{.PACKAGE_DIR}})/scripts/load-image.sh .verify-offline/$(basename {{.PACKAGE_DIR}})
        else
          echo "No container engine found; skipping the OCI image check."
        fi
      - |
        # Prove the vendored source rebuilds with a local toolchain and no
        # module proxy, as an auditor on an offline machine would.
        mkdir -p .verify-offline/rebuild
        tar -xzf .verify-offline/$(basename {{.PACKAGE_DIR}})/source/gogs-mcp-*.tar.gz -C .verify-offline/rebuild
        cd .verify-offline/rebuild && env GOTOOLCHAIN=local GOPROXY=off go build -o ../rebuilt-gogs-mcp ./cmd/gogs-mcp && ../rebuilt-gogs-mcp version --json
      - |
        # Install and uninstall inside a network-less namespace; fall back to
        # running them directly when the environment forbids new namespaces.
        if unshare -n true 2>/dev/null; then
          unshare -n sh -c "cd '$(pwd)' && .verify-offline/$(basename {{.PACKAGE_DIR}})/scripts/install.sh --prefix '$(pwd)/.verify-offline/prefix' && .verify-offline/$(basename {{.PACKAGE_DIR}})/scripts/uninstall.sh --prefix '$(pwd)/.verify-offline/prefix'"
        else
          .verify-offline/$(basename {{.PACKAGE_DIR}})/scripts/install.sh --prefix "$(pwd)/.verify-offline/prefix"
          .verify-offline/$(basename {{.PACKAGE_DIR}})/scripts/uninstall.sh --prefix "$(pwd)/.verify-offline/prefix"
        fi
      - rm -rf .verify-offline
      - echo "Offline verification passed."

  test:
    desc: Run unit and protocol tests with coverage and the race detector.
    cmds:
      - go test -cover -race ./...

  test:integration:
    desc: Run HTTP contract tests through the MCP protocol layer.
    cmds:
      - go test -tags=integration -count=1 -v ./tests/integration

  test:e2e:smoke:
    desc: Run the isolated Gogs v0.14.2 stdio smoke test.
    deps: [build]
    cmds:
      - go test -tags=e2e -count=1 -timeout=25m -v ./tests/e2e -run '^TestSmoke$'

  test:e2e:repositories:
    desc: Run repository visibility tests against isolated Gogs v0.14.2.
    deps: [build]
    cmds:
      - go test -tags=e2e -count=1 -timeout=25m -v ./tests/e2e -run '^TestRepositories$'

  test:e2e:contents:
    desc: Run bounded source browsing tests against isolated Gogs v0.14.2.
    deps: [build]
    cmds:
      - go test -tags=e2e -count=1 -timeout=25m -v ./tests/e2e -run '^TestContents$'

  test:e2e:git:
    desc: Run branch and commit inspection tests against isolated Gogs v0.14.2.
    deps: [build]
    cmds:
      - go test -tags=e2e -count=1 -timeout=25m -v ./tests/e2e -run '^TestGit$'

  test:e2e:search:
    desc: Run literal code search tests against isolated Gogs v0.14.2.
    deps: [build]
    cmds:
      - go test -tags=e2e -count=1 -timeout=25m -v ./tests/e2e -run '^TestSearch$'

  test:e2e:issues:
    desc: Run issue browsing and writing tests against isolated Gogs v0.14.2.
    deps: [build]
    cmds:
      - go test -tags=e2e -count=1 -timeout=25m -v ./tests/e2e -run '^TestIssue'

  test:e2e:protocol:
    desc: Run the legacy MCP initialize compatibility test.
    deps: [build]
    cmds:
      - go test -tags=e2e -count=1 -timeout=25m -v ./tests/e2e -run '^TestLegacyInitializeProtocol$'

  test:e2e:
    desc: Run every E2E scenario against isolated Gogs v0.14.2; the offline package test runs through verify:offline.
    cmds:
      - task: test:e2e:smoke
      - task: test:e2e:repositories
      - task: test:e2e:contents
      - task: test:e2e:git
      - task: test:e2e:search
      - task: test:e2e:issues
      - task: test:e2e:protocol

  lint:
    desc: Run all configured linters.
    cmds:
      - golangci-lint run
